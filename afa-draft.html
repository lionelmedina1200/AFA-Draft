<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFA Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1f38;
    --bg2:#16345c;
    --line:rgba(255,255,255,0.4);
    --gold:#ffffff;
    --gold-dim:rgba(255,255,255,0.55);
    --white:#ffffff;
    --dim:rgba(255,255,255,0.75);
    --red:#ff6b5b;
    --green-btn:#0b3d66;
    --text-dark:#0b2e4d;
    --sky:#6ec9ef;
  }
  *{box-sizing:border-box;}
  button{ font-family:inherit; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 60% 35% at 15% 0%, rgba(255,255,255,0.22), transparent 60%),
      radial-gradient(ellipse 60% 35% at 85% 0%, rgba(255,255,255,0.22), transparent 60%),
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(66,150,99,0.30), transparent 65%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px),
      linear-gradient(180deg, #0b1830 0%, #12294c 45%, #0d2038 100%);
    background-attachment:fixed;
    color:var(--white);
    font-family:'Inter', Arial, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    text-align:center;
    padding:20px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .scoreboard{
    display:inline-block;
    font-family:'Courier New', monospace;
    font-weight:bold;
    font-size:36px;
    letter-spacing:2px;
    color:var(--gold);
    border:1px solid var(--gold-dim);
    padding:2px 14px;
  }
  h1{
    margin:12px 0 4px;
    font-size:19px;
    font-family:'Oswald', 'Inter', sans-serif;
    font-weight:600;
    letter-spacing:.3px;
    color:var(--white);
  }
  header p{
    color:var(--dim);
    font-size:13px;
    margin:0;
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:24px 16px;
  }
  .section-title{
    font-size:12px;
    font-family:'Oswald', 'Inter', sans-serif;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  /* ---- DRAFT ---- */
  .dice-row{
    display:flex;
    justify-content:center;
    margin-bottom:22px;
  }
  #rollBtn{
    background:var(--gold);
    color:var(--text-dark);
    border:1px solid var(--gold-dim);
    font-weight:bold;
    font-size:15px;
    padding:12px 24px;
    border-radius:4px;
    cursor:pointer;
  }
  #rollBtn:disabled{ opacity:.4; cursor:not-allowed; }

  .team-reveal{
    text-align:center;
    margin-bottom:18px;
    min-height:20px;
  }
  .team-reveal p{
    font-size:14px;
    color:var(--dim);
    margin:0;
  }
  .team-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    width:min(94%, 360px);
    min-height:150px;
    padding:16px 20px;
    margin:0 auto;
    border:3px solid var(--gold);
    border-radius:10px;
    background:var(--bg2);
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .team-box .crest-bg{
    position:absolute;
    inset:0;
    background-size:70% auto;
    background-position:center;
    background-repeat:no-repeat;
    opacity:0.28;
    pointer-events:none;
  }
  .team-box-name, .team-box-year{
    position:relative;
    z-index:1;
  }
  .team-box-name{
    font-size:26px;
    font-family:'Oswald', 'Inter', sans-serif;
    font-weight:700;
    color:var(--white);
    letter-spacing:.5px;
    line-height:1.15;
    text-transform:uppercase;
    text-shadow:0 2px 4px rgba(0,0,0,0.55);
    text-align:center;
    max-width:100%;
  }
  .team-box-year{
    font-size:17px;
    font-weight:700;
    color:var(--gold);
    margin-top:4px;
    text-shadow:0 2px 4px rgba(0,0,0,0.55);
  }

  .offer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:12px;
    margin-bottom:26px;
    align-items:stretch;
  }
  .player-card{
    background:var(--bg2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px;
    color:var(--white);
    text-align:center;
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .player-card .card-body{
    flex:1;
  }
  .avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    margin:0 auto 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.85);
    background:linear-gradient(160deg, #3d6da3, #12294a);
  }
  .avatar svg{
    position:absolute;
    width:76%;
    height:76%;
    opacity:.32;
    fill:#ffffff;
  }
  .avatar span{
    position:relative;
    z-index:1;
    font-weight:900;
    font-size:13px;
    letter-spacing:.5px;
    color:#ffffff;
  }
  .player-card .pos-tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:1px;
    padding:2px 6px;
    border-radius:4px;
    background:var(--line);
    color:var(--dim);
    margin-bottom:6px;
  }
  .player-card .name{
    font-family:'Oswald', 'Inter', sans-serif;
    font-weight:600;
    font-size:16px;
    margin-bottom:2px;
    line-height:1.2;
  }
  .player-card .name .star{ color:var(--gold); }
  .player-card .card-media{
    font-family:'Courier New', monospace;
    font-size:30px;
    font-weight:900;
    color:var(--gold);
    line-height:1;
    margin:6px 0 10px;
  }
  .player-card button{
    width:100%;
    padding:7px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--green-btn);
    color:var(--white);
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
    margin-top:auto;
  }
  .player-card button:disabled{
    background:var(--line);
    color:var(--dim);
    cursor:not-allowed;
  }

  /* ---- MEDIA DEL EQUIPO ---- */
  .team-media{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:0 auto 20px;
    text-align:center;
  }
  .team-media-label{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--dim);
  }
  .team-media-value{
    font-family:'Courier New', monospace;
    font-size:34px;
    font-weight:bold;
    color:var(--white);
    border:3px solid var(--gold-dim);
    border-radius:50%;
    width:76px;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,0.18), transparent 60%), var(--bg2);
    box-shadow:0 8px 18px rgba(0,0,0,0.35);
  }
  .team-media-count{
    font-size:12px;
    color:var(--dim);
  }

  .team-stars{
    margin-top:4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .stars-wrap{
    position:relative;
    display:inline-block;
    font-size:20px;
    line-height:1;
    letter-spacing:2px;
  }
  .stars-back{
    color:rgba(255,255,255,0.25);
    white-space:nowrap;
  }
  .stars-front{
    position:absolute;
    top:0;
    left:0;
    overflow:hidden;
    white-space:nowrap;
    color:var(--white);
    text-shadow:0 0 6px rgba(255,255,255,0.5);
    transition:width .3s ease;
  }
  .stars-score{
    font-size:12px;
    font-weight:bold;
    color:var(--dim);
  }

  /* ---- CANCHA ---- */
  .pitch-wrap{
    max-width:340px;
    margin:0 auto 20px;
  }
  .pitch{
    position:relative;
    width:100%;
    aspect-ratio:2/3;
    background:
      repeating-linear-gradient(0deg, #3f7a4d, #3f7a4d 10%, #397249 10%, #397249 20%);
    border:2px solid rgba(255,255,255,0.5);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 12px 26px rgba(0,0,0,0.35);
  }
  .pitch-lines{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
  }
  #pitchSlots{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
  }
  .pitch-slot{
    position:absolute;
    width:17%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2px dashed rgba(255,255,255,0.7);
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.12), transparent 65%), rgba(11,45,77,0.65);
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--white);
    padding:2px;
  }
  .pitch-slot .slot-pos{
    font-size:8px;
    letter-spacing:.5px;
    opacity:.85;
  }
  .pitch-slot.filled{
    border-style:solid;
    border-color:#ffffff;
    background:rgba(11,45,77,0.85);
  }
  .pitch-slot .slot-name{
    font-size:10px;
    font-weight:800;
    line-height:1.15;
    margin-top:2px;
  }
  .pitch-slot .slot-str{
    font-size:8px;
    opacity:.9;
  }

  #startBtn{
    display:block;
    margin:0 auto;
    background:var(--gold);
    color:var(--text-dark);
    border:1px solid var(--gold-dim);
    font-weight:bold;
    font-size:15px;
    padding:12px 26px;
    border-radius:4px;
    cursor:pointer;
  }
  #startBtn:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---- TOURNAMENT ---- */
  .match-card{
    background:var(--bg2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px;
    margin-bottom:14px;
    color:var(--white);
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
  }
  .match-stage{
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:8px;
  }
  .match-score{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    font-size:34px;
    font-weight:900;
    font-family:'Courier New', monospace;
    margin-bottom:10px;
  }
  .match-score .team-name{
    font-size:12px;
    font-weight:600;
    color:var(--dim);
    display:block;
    text-align:center;
  }
  .match-score .side{ flex:1; text-align:center; }
  .match-events{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:20px;
    padding-top:6px;
    text-align:center;
    color:var(--dim);
    font-size:13px;
  }
  .goal-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:20px;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
  }
  .goal-chip.mine{
    background:rgba(255,255,255,0.16);
    color:var(--white);
    border:1.5px solid var(--white);
  }
  .goal-chip.opp{
    background:rgba(255,107,91,0.18);
    color:var(--red);
    border:1.5px solid var(--red);
  }
  .match-penalties{
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:var(--gold);
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
  }

  #nextMatchBtn{
    display:block;
    margin:10px auto 0;
    background:var(--green-btn);
    color:var(--white);
    border:1px solid var(--line);
    font-weight:bold;
    font-size:14px;
    padding:10px 22px;
    border-radius:4px;
    cursor:pointer;
  }
  #nextMatchBtn:disabled{ opacity:.4; cursor:not-allowed; }

  .summary{
    text-align:center;
    padding:24px 16px;
    border:1px solid var(--gold-dim);
    border-radius:4px;
    background:var(--bg2);
    color:var(--white);
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .summary .big-score{
    font-family:'Courier New', monospace;
    font-size:44px;
    font-weight:bold;
    color:var(--gold);
  }
  .summary .verdict{
    font-size:15px;
    margin-top:6px;
    color:var(--white);
  }
  .summary .verdict.perfect{ color:var(--gold); font-weight:bold; }
  #restartBtn{
    margin-top:18px;
    background:transparent;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    padding:8px 18px;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
  }
  .hidden{ display:none !important; }

  /* ---- MODAL DE FASE ---- */
  .phase-modal{
    position:fixed;
    inset:0;
    background:rgba(6,20,36,0.88);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .phase-modal-content{
    text-align:center;
    max-width:360px;
    width:100%;
    background:var(--bg2);
    border:3px solid var(--gold);
    border-radius:14px;
    padding:36px 26px;
  }
  .phase-modal-title{
    font-size:30px;
    font-family:'Oswald', 'Inter', sans-serif;
    font-weight:700;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:12px;
  }
  .phase-modal.champion .phase-modal-title{
    font-size:36px;
  }
  .phase-modal-sub{
    font-size:15px;
    color:var(--white);
    margin-bottom:24px;
    line-height:1.4;
  }
  #phaseModalBtn{
    background:var(--gold);
    color:var(--text-dark);
    border:none;
    font-weight:bold;
    font-size:14px;
    padding:12px 26px;
    border-radius:4px;
    cursor:pointer;
  }

</style>
</head>
<body>

<header>
  <div class="scoreboard" id="scoreboard">AFA</div>
  <h1>AFA Draft · Arma tu equipo de ensueño</h1>
</header>

<main>

  <!-- DRAFT -->
  <section id="draftSection">
    <p class="section-title">Sorteo</p>
    <div class="dice-row">
      <button id="rollBtn">🎲 Tirar el dado</button>
    </div>
    <div class="team-reveal" id="teamReveal"></div>
    <div class="offer-grid" id="offerGrid"></div>

    <p class="section-title">Tu XI (formación 4-3-3)</p>
    <div class="team-media">
      <div class="team-media-label">Media del equipo</div>
      <div class="team-media-value" id="teamMediaValue">--</div>
      <div class="team-media-count" id="teamMediaCount">0/11 jugadores</div>
      <div class="team-stars" id="teamStars"></div>
    </div>
    <div class="pitch-wrap">
      <div class="pitch" id="pitch">
        <svg class="pitch-lines" viewBox="0 0 100 150" preserveAspectRatio="none">
          <rect x="1" y="1" width="98" height="148" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
          <line x1="1" y1="75" x2="99" y2="75" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
          <circle cx="50" cy="75" r="12" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
          <circle cx="50" cy="75" r="0.8" fill="rgba(255,255,255,0.6)"/>
          <rect x="22" y="1" width="56" height="20" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
          <rect x="36" y="1" width="28" height="8" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
          <rect x="22" y="129" width="56" height="20" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
          <rect x="36" y="141" width="28" height="8" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
        </svg>
        <div id="pitchSlots"></div>
      </div>
    </div>
    <button id="startBtn" disabled>Comenzar el Mundial</button>
  </section>

  <!-- TOURNAMENT -->
  <section id="tournamentSection" class="hidden">
    <p class="section-title">Tu Mundial</p>
    <div id="matchesLog"></div>
    <button id="nextMatchBtn">Jugar el partido →</button>
  </section>

  <!-- SUMMARY -->
  <section id="summarySection" class="hidden">
    <div class="summary">
      <div class="big-score" id="finalScore">0-0-0</div>
      <div class="verdict" id="finalVerdict"></div>
      <button id="restartBtn">Volver a jugar</button>
    </div>
  </section>

</main>

<div class="phase-modal hidden" id="phaseModal">
  <div class="phase-modal-content">
    <div class="phase-modal-title" id="phaseModalTitle"></div>
    <div class="phase-modal-sub" id="phaseModalSub"></div>
    <button id="phaseModalBtn">Continuar</button>
  </div>
</div>

<script>

function initials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

const AVATAR_ICON = `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;

function avatarHtml(player){
  return `<div class="avatar">${AVATAR_ICON}<span>${player.pos}</span></div>`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function starsHtml(ratingOutOf5){
  const pct = Math.max(0, Math.min(100, (ratingOutOf5 / 5) * 100));
  return `
    <div class="stars-wrap">
      <span class="stars-back">★★★★★</span>
      <span class="stars-front" style="width:${pct}%">★★★★★</span>
    </div>
  `;
}

function renderSquad(){
  pitchSlots.innerHTML = '';
  FORMATION.forEach(slot=>{
    const p = squad[slot.id];
    const div = document.createElement('div');
    div.className = 'pitch-slot' + (p ? ' filled' : '');
    div.style.left = slot.x + '%';
    div.style.top = slot.y + '%';
    div.innerHTML = `
      <div class="slot-pos">${slot.pos}</div>
      ${p ? `<div class="slot-name">${p.name.split(' ').slice(-1)[0]}</div><div class="slot-str">${p.str}</div>` : ''}
    `;
    pitchSlots.appendChild(div);
  });

  const players = Object.values(squad);
  const filled = players.length;
  const media = filled > 0 ? Math.round(players.reduce((s,p)=>s+p.str,0)/filled) : null;
  teamMediaValue.textContent = media !== null ? media : '--';
  teamMediaCount.textContent = `${filled}/11 jugadores`;

  const ratingOutOf5 = media !== null ? (media / 20) : 0;
  teamStars.innerHTML = `
    ${starsHtml(ratingOutOf5)}
    <div class="stars-score">${media !== null ? ratingOutOf5.toFixed(1) : '0.0'} / 5</div>
  `;

  startBtn.disabled = filled < FORMATION.length;
  startBtn.textContent = filled < FORMATION.length
    ? `Comenzar el Mundial (${filled}/11)`
    : 'Comenzar el Mundial';

  if(filled >= FORMATION.length){
    rollBtn.disabled = true;
    teamReveal.innerHTML = '<p>Tu XI ya está completo. ¡Comenzá el Mundial!</p>';
    offerGrid.innerHTML = '';
  }
}

function firstEmptySlotFor(pos){
  return FORMATION.find(slot => slot.pos === pos && !squad[slot.id]);
}

function teamKey(team){
  return `${team.name}__${team.year}`;
}

function signPlayer(player, teamLabel, teamKeyId){
  const slot = firstEmptySlotFor(player.pos);
  if(!slot) return;
  squad[slot.id] = {...player, team: teamLabel};
  signedNames.add(player.name);
  usedTeams.add(teamKeyId);
  offerGrid.innerHTML = '';
  renderSquad();
}

function rollDice(){
  if(Object.keys(squad).length >= FORMATION.length){
    return;
  }

  const remainingTeams = TEAMS.filter(t => !usedTeams.has(teamKey(t)));

  if(remainingTeams.length === 0){
    teamReveal.innerHTML = '<p>Ya salieron todos los equipos campeones disponibles.</p>';
    offerGrid.innerHTML = '';
    rollBtn.disabled = true;
    return;
  }

  const team = remainingTeams[Math.floor(Math.random()*remainingTeams.length)];
  const order = {ARQ:0, DEF:1, MED:2, DEL:3};
  const roster = team.players
    .slice()
    .sort((a,b)=> order[a.pos]-order[b.pos]);

  offerGrid.innerHTML = '';
  const [c1, c2] = team.colors || ['#123055', '#0b3d66'];
  const boxBg = `linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)), linear-gradient(135deg, ${c1}, ${c2})`;
  const crestData = CRESTS[team.crestKey];
  const crestLayer = crestData
    ? `<div class="crest-bg" style="background-image:url('${crestData}')"></div>`
    : '';
  teamReveal.innerHTML = `
    <div class="team-box" style="background:${boxBg}">
      ${crestLayer}
      <div class="team-box-name">${team.name}</div>
      <div class="team-box-year">${team.year}</div>
    </div>
  `;

  roster.forEach(player=>{
    const noSlot = !firstEmptySlotFor(player.pos);
    const card = document.createElement('div');
    card.className = 'player-card';
    card.innerHTML = `
      <div class="card-body">
        ${avatarHtml(player)}
        <span class="pos-tag">${player.pos}</span>
        <div class="name">${player.legend ? '<span class="star">★</span> ' : ''}${player.name}</div>
        <div class="card-media">${player.str}</div>
      </div>
      <button ${noSlot ? 'disabled' : ''}>${noSlot ? 'Sin cupo' : 'Fichar'}</button>
    `;
    card.querySelector('button').addEventListener('click', ()=> signPlayer(player, `${team.name} ${team.year}`, teamKey(team)));
    offerGrid.appendChild(card);
  });
}

rollBtn.addEventListener('click', rollDice);

/* ---------------- TOURNAMENT LOGIC ---------------- */
const draftSection = document.getElementById('draftSection');
const tournamentSection = document.getElementById('tournamentSection');
const summarySection = document.getElementById('summarySection');
const matchesLog = document.getElementById('matchesLog');
const nextMatchBtn = document.getElementById('nextMatchBtn');
const phaseModal = document.getElementById('phaseModal');
const phaseModalTitle = document.getElementById('phaseModalTitle');
const phaseModalSub = document.getElementById('phaseModalSub');
const phaseModalBtn = document.getElementById('phaseModalBtn');
let eliminationMessage = null;

function showPhaseModal(title, sub, onContinue, isChampion=false, isFinal=false){
  phaseModalTitle.textContent = title;
  phaseModalSub.textContent = sub;
  phaseModal.classList.toggle('champion', isChampion);
  phaseModalBtn.textContent = isFinal ? 'Ver resumen' : 'Continuar';
  phaseModal.classList.remove('hidden');
  phaseModalBtn.onclick = () => {
    phaseModal.classList.add('hidden');
    if(onContinue) onContinue();
  };
}

function matchWon(result){
  if(result.penalties) return result.penalties.my > result.penalties.opp;
  return result.myGoals > result.oppGoals;
}

function groupPoints(){
  let pts = 0;
  matchResults.slice(0,3).forEach(r=>{
    if(r.myGoals > r.oppGoals) pts += 3;
    else if(r.myGoals === r.oppGoals) pts += 1;
  });
  return pts;
}

function eliminateTournament(stageIndex, message){
  eliminationMessage = message;
  nextMatchBtn.classList.add('hidden');
  showPhaseModal('Eliminado', message, ()=> showSummary(), false, true);
}

function handlePhaseTransition(stageIndex, result){
  // fin de la fase de grupos: se necesitan más de 4 puntos para pasar
  if(stageIndex === 2){
    const pts = groupPoints();
    if(pts > 4){
      finishMatchReveal(stageIndex);
      showPhaseModal('¡Felicidades!', `Pasaste a Octavos de Final con ${pts} puntos en la fase de grupos.`, null);
    }else{
      eliminateTournament(stageIndex, `No alcanzaste los puntos necesarios en la fase de grupos (${pts} puntos, se necesitan más de 4). Quedaste eliminado.`);
    }
    return;
  }

  // fases eliminatorias: si perdés, se acabó el mundial
  if(stageIndex >= 3){
    const won = matchWon(result);
    if(!won){
      eliminateTournament(stageIndex, `Quedaste eliminado en ${STAGES[stageIndex]}.`);
      return;
    }
    if(stageIndex === 6){
      nextMatchBtn.classList.add('hidden');
      showPhaseModal('¡Campeón!', '¡Ganaste la Final! Sos el campeón del Mundial 7–0.', ()=> showSummary(), true, true);
      return;
    }
    const NEXT_STAGE_NAME = {3:'Cuartos de Final', 4:'Semifinal', 5:'la Final'};
    finishMatchReveal(stageIndex);
    showPhaseModal('¡Felicidades!', `Pasaste a ${NEXT_STAGE_NAME[stageIndex]}.`, null);
    return;
  }

  // partidos 1 y 2 de la fase de grupos: se sigue de largo
  finishMatchReveal(stageIndex);
}

function poisson(lambda){
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do{ k++; p *= Math.random(); } while(p > L);
  return k - 1;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }

function teamStrength(){
  const players = Object.values(squad);
  return players.reduce((s,p)=>s+p.str,0) / players.length;
}

function teamAvgStrength(team){
  return team.players.reduce((s,p)=>s+p.str,0) / team.players.length;
}

function opponentFor(stageIndex){
  // Los rivales salen de los planteles reales, sin repetir dentro del mismo
  // mundial y evitando enfrentar a un plantel que vos mismo usaste para armar tu XI.
  let pool = TEAMS.filter(t => {
    const key = teamKey(t);
    return !usedRivals.has(key) && !usedTeams.has(key);
  });
  if(pool.length === 0){
    pool = TEAMS.filter(t => !usedTeams.has(teamKey(t)));
  }
  if(pool.length === 0){
    pool = TEAMS; // caso extremo: se agotó todo, se permite repetir
  }

  const team = pool[Math.floor(Math.random()*pool.length)];
  const key = teamKey(team);
  usedRivals.add(key);

  const wobble = (Math.random()*8) - 4; // variación de forma del rival ese día
  return {
    name: `${team.name} ${team.year}`,
    str: teamAvgStrength(team) + wobble,
  };
}

function simulateMatch(myStr, oppStr){
  // "Factor del día": cada equipo puede rendir mejor o peor que su media en
  // un partido puntual (lesiones, presión, un golazo, un error puntual, etc).
  // Así la media pesa, pero no es lo único que decide el resultado.
  const myForm = myStr + (Math.random()*22 - 11);   // +/- 11 puntos de variación
  const oppForm = oppStr + (Math.random()*22 - 11);

  let diff = myForm - oppForm;
  diff = clamp(diff, -22, 22); // se limita cuánto puede pesar la diferencia

  const expMy = clamp(1.35 + diff/28, 0.25, 4.2);
  const expOpp = clamp(1.1 - diff/32, 0.2, 3.6);
  const myGoals = poisson(expMy);
  const oppGoals = poisson(expOpp);

  const events = [];
  for(let i=0;i<myGoals;i++) events.push({min: 1+Math.floor(Math.random()*90), mine:true});
  for(let i=0;i<oppGoals;i++) events.push({min: 1+Math.floor(Math.random()*90), mine:false});
  events.sort((a,b)=>a.min-b.min);

  return {myGoals, oppGoals, events};
}

function simulatePenalties(){
  const kickIn = () => Math.random() < 0.76; // ~76% de conversión
  let my = 0, opp = 0;
  for(let i=0;i<5;i++){ if(kickIn()) my++; }
  for(let i=0;i<5;i++){ if(kickIn()) opp++; }
  let safety = 0;
  while(my === opp && safety < 40){
    if(kickIn()) my++;
    if(kickIn()) opp++;
    safety++;
  }
  if(my === opp) my++; // desempate de seguridad, caso extremo
  return {my, opp};
}

function startTournament(){
  draftSection.classList.add('hidden');
  tournamentSection.classList.remove('hidden');
  playNextMatch();
}

function playNextMatch(){
  const stageIndex = matchResults.length;
  if(stageIndex >= STAGES.length){
    showSummary();
    return;
  }

  const isKnockout = stageIndex >= 3; // desde octavos de final
  const myStr = teamStrength();
  const opp = opponentFor(stageIndex);
  const result = simulateMatch(myStr, opp.str);
  result.oppName = opp.name;

  if(isKnockout && result.myGoals === result.oppGoals){
    result.penalties = simulatePenalties();
  }
  matchResults.push(result);

  const penaltiesLine = result.penalties
    ? `<div class="match-penalties">Definido por penales: ${result.penalties.my} – ${result.penalties.opp}</div>`
    : '';

  const card = document.createElement('div');
  card.className = 'match-card';
  card.innerHTML = `
    <div class="match-stage">${STAGES[stageIndex]}</div>
    <div class="match-score">
      <div class="side">
        <div>${result.myGoals}</div>
        <span class="team-name">Tu equipo</span>
      </div>
      <div>–</div>
      <div class="side">
        <div>${result.oppGoals}</div>
        <span class="team-name">${result.oppName}</span>
      </div>
    </div>
    <div class="match-events" id="events-${stageIndex}"></div>
    <div class="match-penalties-slot" id="penalties-${stageIndex}"></div>
  `;
  matchesLog.appendChild(card);
  card.scrollIntoView({behavior:'smooth', block:'end'});

  nextMatchBtn.disabled = true;
  const eventsEl = card.querySelector(`#events-${stageIndex}`);
  let i = 0;
  function revealNext(){
    if(i >= result.events.length){
      revealPenalties();
      return;
    }
    const ev = result.events[i];
    const chip = document.createElement('span');
    chip.className = 'goal-chip ' + (ev.mine ? 'mine' : 'opp');
    chip.textContent = `⚽ ${ev.min}' ${ev.mine ? 'Tu equipo' : result.oppName}`;
    eventsEl.appendChild(chip);
    i++;
    setTimeout(revealNext, 350);
  }
  function revealPenalties(){
    if(result.penalties){
      card.querySelector(`#penalties-${stageIndex}`).innerHTML = penaltiesLine;
    }
    handlePhaseTransition(stageIndex, result);
  }
  if(result.events.length === 0){
    eventsEl.textContent = 'Sin goles en el partido.';
    revealPenalties();
  }else{
    revealNext();
  }
}

function finishMatchReveal(stageIndex){
  nextMatchBtn.disabled = false;
  nextMatchBtn.textContent = stageIndex + 1 >= STAGES.length
    ? 'Ver resultado final →'
    : 'Jugar el siguiente partido →';
}

nextMatchBtn.addEventListener('click', playNextMatch);
startBtn.addEventListener('click', startTournament);

/* ---------------- SUMMARY ---------------- */
function showSummary(){
  tournamentSection.classList.add('hidden');
  summarySection.classList.remove('hidden');

  let wins=0, draws=0, losses=0, gf=0, ga=0, penaltyWins=0;
  matchResults.forEach(r=>{
    gf += r.myGoals; ga += r.oppGoals;
    if(r.penalties){
      if(r.penalties.my > r.penalties.opp){ wins++; penaltyWins++; }
      else { losses++; }
    }else if(r.myGoals > r.oppGoals) wins++;
    else if(r.myGoals === r.oppGoals) draws++;
    else losses++;
  });

  document.getElementById('finalScore').textContent = `${wins}G ${draws}E ${losses}P`;

  const verdict = document.getElementById('finalVerdict');
  const penaltyNote = penaltyWins > 0 ? ` (${penaltyWins} definido${penaltyWins>1?'s':''} por penales)` : '';
  if(wins === 7 && ga === 0){
    verdict.innerHTML = `¡7–0 PERFECTO! Campeón invicto y sin recibir goles${penaltyNote}.<br>Goles a favor: ${gf}`;
    verdict.classList.add('perfect');
  }else if(eliminationMessage){
    verdict.textContent = `${eliminationMessage} (${wins}G ${draws}E ${losses}P, ${gf}-${ga})${penaltyNote}.`;
  }else if(losses === 0){
    verdict.textContent = `Campeón invicto, con ${ga} goles recibidos${penaltyNote}. Muy cerca del 7–0.`;
  }else{
    verdict.textContent = `Terminaste con ${wins} victorias, ${draws} empates y ${losses} derrotas (${gf}-${ga})${penaltyNote}. ¡Vuelve a intentarlo!`;
  }
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  squad = {};
  signedNames = new Set();
  usedTeams = new Set();
  usedRivals = new Set();
  matchResults = [];
  eliminationMessage = null;
  matchesLog.innerHTML = '';
  offerGrid.innerHTML = '';
  teamReveal.innerHTML = '';
  rollBtn.disabled = false;
  nextMatchBtn.classList.remove('hidden');
  renderSquad();
  summarySection.classList.add('hidden');
  draftSection.classList.remove('hidden');
});

renderSquad();
</script>
